  <script>
    (function() {
      const pageParams = new URLSearchParams(location.search);
      const id = pageParams.get('id');
      if (!id) { location.href = '/events.html'; return; }

      pageParams.delete('id');
      const reviewQuery = pageParams.toString();
      const eventsParams = new URLSearchParams(pageParams);
      eventsParams.delete('after');
      eventsParams.delete('before');
      const eventsQuery = eventsParams.toString();
      const eventsURL = '/events.html' + (eventsQuery ? '?' + eventsQuery : '');
      const breadcrumbLink = document.querySelector('.breadcrumb a');
      if (breadcrumbLink) breadcrumbLink.href = eventsURL;

      const el = document.getElementById('event-detail');
      el.setAttribute('hx-get', '/partials/event/' + encodeURIComponent(id) + (reviewQuery ? '?' + reviewQuery : ''));
      el.setAttribute('hx-trigger', 'load');
      htmx.process(el);

      el.addEventListener('htmx:afterSwap', function() {
        const root = el.querySelector('.event-detail-root');
        if (!root) return;
        const camera = root.dataset.eventCamera || '';
        const label = root.dataset.eventLabel || '';
        const time = root.dataset.eventTime || '';
        const displayLabel = label.replace(/[-_]+/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
        const crumb = document.getElementById('event-breadcrumb');
        if (crumb && camera) crumb.textContent = camera + ' · ' + time;
        if (camera && label) document.title = displayLabel + ' · ' + camera + ' - Vedetta';
      });
    })();
  </script>
