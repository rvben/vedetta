services:
  vedetta:
    build: .
    image: ghcr.io/rvben/vedetta:latest
    container_name: vedetta
    restart: unless-stopped

    # Host networking is required for:
    # - Direct RTSP camera access on the local network
    # - ONVIF device discovery via UDP multicast (port 3702)
    # Without host networking, each camera's RTSP port must be
    # explicitly forwarded and ONVIF discovery will not work.
    network_mode: host

    volumes:
      - ./config:/config
      - vedetta-data:/data

    environment:
      - TZ=${TZ:-UTC}

    # The binary probes itself. The runtime image ships no wget or curl, and
    # /api/health requires authentication; /api/health/live is the endpoint
    # that answers unauthenticated and before the readiness gate opens. The
    # subcommand reads the same config as the server, so a non-default
    # api.port or TLS setting is followed rather than assumed.
    healthcheck:
      test: ["CMD", "vedetta", "healthcheck", "-config", "/config/config.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  vedetta-data:
