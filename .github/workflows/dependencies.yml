name: Dependency health

on:
  schedule:
    - cron: "48 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b183939ff7dc62539afb00b3c555ffbfe3c5d58b # v0.18.2
    with:
      langs: go,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: GOTOOLCHAIN="go$(awk '$1=="go"{print $2}' go.mod)" make lint-install && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/workflows/*.yaml
        .github/workflows/*.yml
        go.mod
        go.sum
