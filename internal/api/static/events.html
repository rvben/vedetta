  <main class="page">
    <div class="page-header">
      <div>
        <h1>Events</h1>
        <p class="events-summary" id="events-summary" aria-live="polite">Reviewing recorded activity…</p>
      </div>
    </div>

    <div class="events-toolbar">
      <div class="events-toolbar-primary">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="event-search" class="search-input" placeholder="Search events…" aria-label="Search by camera, label, or recognized name" autocomplete="off">
        </div>
        <label class="events-range-control">
          <span class="sr-only">Time range</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <select id="event-range" data-action-change="reloadEvents()" aria-label="Event time range">
            <option value="">All time</option>
            <option value="today">Today</option>
            <option value="24h">Last 24 hours</option>
            <option value="7d">Last 7 days</option>
          </select>
        </label>
        <button type="button" class="btn btn-sm events-filter-toggle" id="events-filter-toggle" data-action-click="toggleEventsFilters()" aria-controls="events-filter-panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters <span class="events-filter-count" id="events-filter-count" hidden>0</span>
        </button>
      </div>

      <div class="events-quick-row">
        <div class="chip-bar events-label-chips" id="filter-chips" role="toolbar" aria-label="Event labels">
          <button class="chip active" data-filter="label" data-value="" data-action-click="toggleChip(this, 'label')" aria-pressed="true">All</button>
          <button class="chip" data-filter="label" data-value="person" data-action-click="toggleChip(this, 'label')" aria-pressed="false"><span class="chip-dot person"></span>Person</button>
          <button class="chip" data-filter="label" data-value="car" data-action-click="toggleChip(this, 'label')" aria-pressed="false"><span class="chip-dot car"></span>Car</button>
          <button class="chip" data-filter="label" data-value="dog" data-action-click="toggleChip(this, 'label')" aria-pressed="false"><span class="chip-dot dog"></span>Dog</button>
          <button class="chip" data-filter="label" data-value="cat" data-action-click="toggleChip(this, 'label')" aria-pressed="false"><span class="chip-dot cat"></span>Cat</button>
        </div>
        <span class="events-active-filter-summary" id="events-active-filter-summary" hidden></span>
        <button class="btn btn-sm btn-ghost events-clear-filters" id="events-clear-filters" data-action-click="clearAllEventFilters()" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Reset
        </button>
      </div>

      <div class="events-filter-panel" id="events-filter-panel" hidden>
        <section class="events-filter-group" aria-labelledby="events-priority-label">
          <h2 id="events-priority-label">Priority</h2>
          <div class="chip-bar" id="category-chips" role="toolbar" aria-label="Priority">
            <button class="chip active" data-filter="category" data-value="" data-action-click="toggleChip(this, 'category')" aria-pressed="true">Any priority</button>
            <button class="chip" data-filter="category" data-value="alert" data-action-click="toggleChip(this, 'category')" aria-pressed="false">Alerts</button>
            <button class="chip" data-filter="category" data-value="detection" data-action-click="toggleChip(this, 'category')" aria-pressed="false">Low priority</button>
          </div>
        </section>
        <section class="events-filter-group" aria-labelledby="events-camera-label">
          <h2 id="events-camera-label">Camera</h2>
          <div class="chip-bar" id="camera-chips" role="toolbar" aria-label="Cameras">
            <button class="chip active" data-filter="camera" data-value="" data-action-click="toggleChip(this, 'camera')" aria-pressed="true">Any camera</button>
          </div>
        </section>
        <section class="events-filter-group" id="events-object-group" aria-labelledby="events-object-label" hidden>
          <h2 id="events-object-label">Recognized as</h2>
          <div class="chip-bar" id="object-chips" role="toolbar" aria-label="Recognized identities"></div>
        </section>
      </div>
    </div>

    <button type="button" class="events-new-banner" id="events-new-banner" data-action-click="showNewestEvents()" hidden aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span id="events-new-banner-label">New activity</span>

    <!-- Event Gallery -->
    <div class="event-gallery"

         hx-trigger="load"
         hx-swap="innerHTML"
         role="list"
         aria-label="Detection events">
      <div class="loading-state">Loading events...</div>
    </div>

  <!-- Keyboard Shortcut Modal -->
  <div class="toast-container" id="toasts"></div>
  <script src="/app.js"></script>
  <script>
    var eventsTotalAll = 0;
    var eventsTodayCount = 0;
    var eventsVisibleTotal = 0;
    var pendingEventCount = 0;

    function setEventChipValue(type, value) {
      var matched = false;
      document.querySelectorAll('.chip[data-filter="' + type + '"]').forEach(function(chip) {
        var active = chip.dataset.value === value;
        chip.classList.toggle('active', active);
        chip.setAttribute('aria-pressed', active ? 'true' : 'false');
        if (active) matched = true;
      });
      return matched;
    }

    function applyEventFiltersFromURL() {
      var params = new URLSearchParams(location.search);
      ['label', 'camera', 'object', 'category'].forEach(function(type) {
        var value = params.get(type) || '';
        if (!setEventChipValue(type, value)) setEventChipValue(type, '');
      });
      var search = document.getElementById('event-search');
      var range = document.getElementById('event-range');
      if (search) search.value = params.get('q') || '';
      if (range) range.value = params.get('range') || '';
    }

    function initialEventRequestURL() {
      var source = new URLSearchParams(location.search);
      var params = new URLSearchParams();
      ['label', 'camera', 'object', 'category', 'q', 'range'].forEach(function(key) {
        if (source.get(key)) params.set(key, source.get(key));
      });
      return eventGalleryRequestURL(params);
    }

    function toggleEventsFilters() {
      var panel = document.getElementById('events-filter-panel');
      var button = document.getElementById('events-filter-toggle');
      var opening = panel.hasAttribute('hidden');
      panel.toggleAttribute('hidden', !opening);
      button.setAttribute('aria-expanded', opening ? 'true' : 'false');
      if (opening) {
        var first = panel.querySelector('.chip');
        if (first) first.focus({ preventScroll: true });
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Escape') return;
      var panel = document.getElementById('events-filter-panel');
      if (panel.hasAttribute('hidden')) return;
      panel.setAttribute('hidden', '');
      var button = document.getElementById('events-filter-toggle');
      button.setAttribute('aria-expanded', 'false');
      button.focus();
    });

    function eventsHasActiveFilter() {
      return collectEventFilterParams().toString() !== '';
    }

    function selectedEventFilterLabel(type) {
      var chip = document.querySelector('.chip[data-filter="' + type + '"].active');
      return chip && chip.dataset.value ? chip.textContent.trim() : '';
    }

    window.updateEventsFilterUI = function() {
      var advancedLabels = ['category', 'camera', 'object']
        .map(selectedEventFilterLabel)
        .filter(Boolean);
      var count = advancedLabels.length;
      var countEl = document.getElementById('events-filter-count');
      var toggle = document.getElementById('events-filter-toggle');
      var activeSummary = document.getElementById('events-active-filter-summary');
      var clearBtn = document.getElementById('events-clear-filters');

      countEl.textContent = count;
      countEl.hidden = count === 0;
      toggle.classList.toggle('has-active', count > 0);
      activeSummary.textContent = advancedLabels.join(' · ');
      activeSummary.hidden = advancedLabels.length === 0;
      clearBtn.hidden = !eventsHasActiveFilter();
      updateEventsSummary(eventsVisibleTotal);
    };

    window.syncEventsURL = function(params) {
      var pageParams = new URLSearchParams(params);
      pageParams.delete('kind');
      var query = pageParams.toString();
      history.replaceState(null, '', location.pathname + (query ? '?' + query : ''));
    }

    function updateEventsSummary(visibleTotal) {
      var summary = document.getElementById('events-summary');
      if (!summary) return;
      var hasFilter = eventsHasActiveFilter();
      if (isFinite(visibleTotal)) eventsVisibleTotal = visibleTotal;

      if (hasFilter) {
        var n = isFinite(eventsVisibleTotal) ? eventsVisibleTotal : 0;
        summary.textContent = n.toLocaleString() + ' event' + (n === 1 ? '' : 's') + ' in this view';
        if (eventsTotalAll > 0) summary.textContent += ' · ' + eventsTotalAll.toLocaleString() + ' recorded';
      } else {
        var total = eventsTotalAll || eventsVisibleTotal;
        var parts = [total.toLocaleString() + ' event' + (total === 1 ? '' : 's') + ' recorded'];
        if (eventsTodayCount > 0) parts.push(eventsTodayCount.toLocaleString() + ' today');
        summary.textContent = parts.join(' · ');
      }
    }

    function clearAllEventFilters() {
      document.querySelectorAll('.chip[data-filter="label"]').forEach(function(c) {
        var active = !c.dataset.value;
        c.classList.toggle('active', active);
        c.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      document.querySelectorAll('.chip[data-filter="camera"]').forEach(function(c) {
        var active = !c.dataset.value;
        c.classList.toggle('active', active);
        c.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      document.querySelectorAll('.chip[data-filter="object"]').forEach(function(c) {
        var active = !c.dataset.value;
        c.classList.toggle('active', active);
        c.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      document.querySelectorAll('.chip[data-filter="category"]').forEach(function(c) {
        var active = !c.dataset.value;
        c.classList.toggle('active', active);
        c.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      var search = document.getElementById('event-search');
      if (search) search.value = '';
      var range = document.getElementById('event-range');
      if (range) range.value = '';
      if (typeof reloadEvents === 'function') reloadEvents();
    }

    function eventDayKey(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }

    function eventDayLabel(date) {
      var now = new Date();
      var today = eventDayKey(now);
      var yesterdayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
      var key = eventDayKey(date);
      if (key === today) return 'Today';
      if (key === eventDayKey(yesterdayDate)) return 'Yesterday';
      return new Intl.DateTimeFormat(undefined, {
        weekday: 'long', month: 'long', day: 'numeric',
        year: date.getFullYear() === now.getFullYear() ? undefined : 'numeric'
      }).format(date);
    }

    function groupEventCardsByDay() {
      var gallery = document.getElementById('events-gallery');
      if (!gallery) return;
      gallery.querySelectorAll(':scope > .event-date-heading').forEach(function(heading) { heading.remove(); });

      var previousKey = '';
      gallery.querySelectorAll(':scope > .event-card').forEach(function(card) {
        var date = new Date(card.dataset.eventTime || '');
        if (isNaN(date)) return;
        var key = eventDayKey(date);
        if (key !== previousKey) {
          var heading = document.createElement('h2');
          heading.className = 'event-date-heading';
          heading.dataset.eventDay = key;
          heading.textContent = eventDayLabel(date);
          gallery.insertBefore(heading, card);
          previousKey = key;
        }
      });
    }

    function decorateEventLinks() {
      var params = collectEventFilterParams();
      var after = eventRangeAfter(params.get('range'));
      if (after) params.set('after', after);
      document.querySelectorAll('#events-gallery .event-card').forEach(function(card) {
        var url = new URL(card.getAttribute('href'), location.origin);
        params.forEach(function(value, key) { url.searchParams.set(key, value); });
        card.href = url.pathname + '?' + url.searchParams.toString();
      });
    }

    function enhanceEventGallery() {
      groupEventCardsByDay();
      decorateEventLinks();
    }

    function showFilteredEmptyState() {
      var gallery = document.getElementById('events-gallery');
      if (!gallery || gallery.querySelector('.event-card') || !eventsHasActiveFilter()) return;
      gallery.innerHTML = ''
        + '<div class="empty-state events-empty-state">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
        + '<h2>No matching events</h2>'
        + '<p>Try a broader time range or remove one of the filters.</p>'
        + '<button class="btn btn-sm btn-primary" data-action-click="clearAllEventFilters()">Reset filters</button>'
        + '</div>';
    }

    document.body.addEventListener('htmx:afterSwap', function(e) {
      var xhr = e.detail && e.detail.xhr;
      if (!xhr || xhr.responseURL.indexOf('/partials/events-gallery') === -1) return;
      var total = xhr ? parseInt(xhr.getResponseHeader('X-Total-Count') || '', 10) : NaN;
      if (!isFinite(total)) total = document.querySelectorAll('#events-gallery .event-card').length;
      updateEventsSummary(total);
      showFilteredEmptyState();
      enhanceEventGallery();
    });

    document.addEventListener('vedetta:event', function() {
      if (eventsHasActiveFilter()) return;
      pendingEventCount++;
      var banner = document.getElementById('events-new-banner');
      var label = document.getElementById('events-new-banner-label');
      label.textContent = pendingEventCount === 1 ? '1 new event' : pendingEventCount + ' new events';
      banner.hidden = false;
    });

    function showNewestEvents() {
      pendingEventCount = 0;
      document.getElementById('events-new-banner').hidden = true;
      reloadEvents();
      document.querySelector('.events-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function fetchEventPageJSON(url) {
      return fetch(url).then(function(response) {
        if (!response.ok) throw new Error(url + ' returned ' + response.status);
        return response.json();
      });
    }

    function populateEventCameras(camData) {
      var bar = document.getElementById('camera-chips');
      (camData.items || []).map(function(c) { return c.name; }).forEach(function(name) {
        var btn = document.createElement('button');
        btn.className = 'chip';
        btn.dataset.filter = 'camera';
        btn.dataset.value = name;
        btn.setAttribute('aria-pressed', 'false');
        btn.textContent = name.replace(/[_-]/g, ' ').replace(/\b\w/g, function(ch) { return ch.toUpperCase(); });
        btn.onclick = function() { toggleChip(this, 'camera'); };
        bar.appendChild(btn);
      });
    }

    function populateEventObjects(objects) {
      if (objects && objects.length > 0) {
        var seenNames = {};
        var uniqueObjects = [];
        objects.forEach(function(obj) {
          var key = obj.name.toLowerCase();
          if (!seenNames[key]) {
            seenNames[key] = true;
            uniqueObjects.push(obj);
          }
        });
        document.getElementById('events-object-group').hidden = false;
        var objBar = document.getElementById('object-chips');
        var allObjBtn = document.createElement('button');
        allObjBtn.className = 'chip active';
        allObjBtn.dataset.filter = 'object';
        allObjBtn.dataset.value = '';
        allObjBtn.setAttribute('aria-pressed', 'true');
        allObjBtn.textContent = 'Any tracked';
        allObjBtn.onclick = function() { toggleChip(this, 'object'); };
        objBar.appendChild(allObjBtn);
        uniqueObjects.forEach(function(obj) {
          var btn = document.createElement('button');
          btn.className = 'chip';
          btn.dataset.filter = 'object';
          btn.dataset.value = obj.name;
          btn.setAttribute('aria-pressed', 'false');
          btn.textContent = obj.name;
          btn.onclick = function() { toggleChip(this, 'object'); };
          objBar.appendChild(btn);
        });
      }
    }

    applyEventFiltersFromURL();
    document.getElementById('events-gallery').setAttribute('hx-get', initialEventRequestURL());
    initEventSearch();
    updateEventsFilterUI();

    Promise.allSettled([
      fetchEventPageJSON('/api/cameras'),
      fetchEventPageJSON('/api/events/counts'),
      fetchEventPageJSON('/api/objects').then(function(data) { return data.items || data || []; })
    ]).then(function(results) {
      if (results[0].status === 'fulfilled') populateEventCameras(results[0].value);
      if (results[1].status === 'fulfilled') {
        eventsTotalAll = results[1].value.total || 0;
        eventsTodayCount = results[1].value.today || 0;
      }
      if (results[2].status === 'fulfilled') populateEventObjects(results[2].value);
      applyEventFiltersFromURL();
      updateEventsFilterUI();
      enhanceEventGallery();
    });
  </script>
</body>
</html>
