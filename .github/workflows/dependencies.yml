name: Dependency health

on:
  schedule:
    - cron: "48 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@51190124da92968ae09584e148ca92b696da1975 # v0.13.5
    with:
      langs: go,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: make lint-install
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
