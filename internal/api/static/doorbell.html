  <script>
    // Applies the saved theme before the stylesheet is linked, so the light
    // palette is in place the first time any style is resolved. Setting the
    // attribute after the stylesheet leaves WebKit serving the dark value of an
    // inherited custom property to the body while the root already reports the
    // light one, which paints light text on the dark canvas until an unrelated
    // recalculation happens to clear it.
    try {
      if (localStorage.getItem('vedetta-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', '#ffffff');
      }
    } catch (_) {}
  </script>

  <script>
    // Initialize search and infinite scroll
    initEventSearch();

    var eventsTotalAll = 0;

    function eventsHasActiveFilter() {
      var cameraChip = document.querySelector('.chip[data-filter="camera"].active');
      var search = (document.getElementById('event-search') || {}).value || '';
      return !!(
        (cameraChip && cameraChip.dataset.value) ||
        search.trim()
      );
    }

    function updateEventsSummary(visibleTotal) {
      var summary = document.getElementById('events-summary');
      if (!summary) return;
      var clearBtn = document.getElementById('events-clear-filters');
      var hasFilter = eventsHasActiveFilter();
      if (clearBtn) clearBtn.hidden = !hasFilter;

      if (hasFilter) {
        var n = isFinite(visibleTotal) ? visibleTotal : 0;
        summary.textContent = n.toLocaleString() + ' of ' + eventsTotalAll.toLocaleString() + ' rings match';
      } else {
        summary.textContent = eventsTotalAll.toLocaleString() + ' ring' + (eventsTotalAll === 1 ? '' : 's') + ' recorded';
      }
    }

    function clearAllEventFilters() {
      document.querySelectorAll('.chip[data-filter="camera"]').forEach(function(c) {
        var active = !c.dataset.value;
        c.classList.toggle('active', active);
        c.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      var search = document.getElementById('event-search');
      if (search) search.value = '';
      if (typeof reloadEvents === 'function') reloadEvents();
      updateEventsSummary(eventsTotalAll);
    }

    document.getElementById('events-gallery').addEventListener('htmx:afterSwap', function(e) {
      var xhr = e.detail && e.detail.xhr;
      var total = xhr ? parseInt(xhr.getResponseHeader('X-Total-Count') || '', 10) : NaN;
      if (!isFinite(total)) total = e.target.querySelectorAll('.event-card').length;
      updateEventsSummary(total);

      if (total === 0 && eventsHasActiveFilter()) {
        e.target.innerHTML = ''
          + '<div class="empty-state" style="grid-column:1/-1">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
          + '<p>No doorbell rings match the current filters.</p>'
          + '<button class="btn btn-sm btn-primary" data-action-click="clearAllEventFilters()">Clear filters</button>'
          + '</div>';
      }
    });

    // Populate camera chips and fetch total count.
    Promise.all([
      fetch('/api/cameras').then(function(r) { return r.json(); }),
      fetch('/api/events/counts?kind=doorbell').then(function(r) { return r.json(); })
    ]).then(function(results) {
      var camData = results[0];
      var counts = results[1] || {};
      var byCamera = counts.by_camera || {};
      eventsTotalAll = counts.total || 0;
      updateEventsSummary(eventsTotalAll);

      // Camera chips
      var bar = document.getElementById('camera-chips');
      (camData.items || []).map(function(c) { return c.name; }).forEach(function(name) {
        var btn = document.createElement('button');
        btn.className = 'chip';
        btn.dataset.filter = 'camera';
        btn.dataset.value = name;
        btn.setAttribute('aria-pressed', 'false');
        btn.textContent = name.replace(/[_-]/g, ' ').replace(/\b\w/g, function(ch) { return ch.toUpperCase(); });
        if (byCamera[name]) {
          var count = document.createElement('span');
          count.className = 'count';
          count.textContent = byCamera[name].toLocaleString();
          btn.appendChild(document.createTextNode(' '));
          btn.appendChild(count);
        }
        btn.onclick = function() { toggleChip(this, 'camera'); };
        bar.appendChild(btn);
      });
    });
  </script>
