# Vedetta NVR log rotation for macOS.
#
# Only needed when Vedetta is not rotating its own log. Setting logging.file
# together with logging.max_size_mb and logging.max_backups in config.yml is
# the simpler route, and it avoids two rotators competing for one file.
#
# Replace YOUR_USERNAME with the account that runs Vedetta, then:
#   sudo cp deploy/vedetta.newsyslog.conf /etc/newsyslog.d/vedetta.conf
#
# logfilename                                      [owner:group] mode count size(KB) when  flags
/Users/YOUR_USERNAME/Library/Logs/vedetta/vedetta.log              644  5     10240    *     NJ
