name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make lint-install

      - run: make check

  # Dependency vulnerability scan. A separate job on purpose: its verdict turns
  # on advisories published upstream rather than on anything in this tree, so a
  # newly disclosed CVE must be able to report itself without blocking a
  # release. It is absent from the release job's needs for that reason. A
  # finding here is real and worth a dependency bump, it just is not a reason
  # to refuse to publish code that was already written.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make vulncheck-install

      - run: make vulncheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: make test-browser

  # Compile-check the opt-in VA-API and NVDEC hardware-decode paths so they
  # cannot silently break. The Docker build installs libavcodec/libva and builds
  # with -tags hwaccel inside the image (NVDEC links no CUDA at build time),
  # so this is self-contained with no runner-specific apt or GPU steps.
  build-hwaccel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: make docker-build-hwaccel

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, build-hwaccel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Refuse to publish a build that cannot name itself. This runs before
      # anything is pushed, so a missing -X flag stops the release instead of
      # shipping an image and binaries that report the wrong version and nag
      # every user about an update they already have.
      - run: make verify-version VERSION=${{ github.ref_name }}

      # VERSION is the tag being released. Passing it explicitly rather than
      # letting the image derive one keeps a shallow runner checkout from
      # publishing an image that calls itself "dev".
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/rvben/vedetta:${{ github.ref_name }}
            ghcr.io/rvben/vedetta:latest

      # Hardware-accelerated variant (VA-API for Intel/AMD, NVDEC for NVIDIA),
      # linux/amd64 only - this is x86 GPU territory and the image links
      # libavcodec/libva.
      - uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile.hwaccel
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/rvben/vedetta:${{ github.ref_name }}-hwaccel
            ghcr.io/rvben/vedetta:hwaccel

      - run: make build-release VERSION=${{ github.ref_name }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/vedetta-linux-amd64
            build/vedetta-linux-arm64
          generate_release_notes: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Publish to PyPI
        run: |
          pip install uv
          cd pypi && uv build && uv publish --username __token__ --password "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
