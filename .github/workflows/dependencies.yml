name: Dependency health

on:
  schedule:
    - cron: "48 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@26b08c6b4c6b9ec106894394895eea05111738a5 # v0.15.1
    with:
      langs: go,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: GOTOOLCHAIN="go$(awk '$1=="go"{print $2}' go.mod)" make lint-install && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
